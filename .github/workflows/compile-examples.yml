name: compile-examples

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python host tests
        run: python3 tests/host/test_aaruno.py
      - name: C++ host tests (no Arduino headers)
        run: |
          g++ -std=c++11 -Wall -Wextra -I src tests/host/test_util.cpp src/sensors/AarunoDigital.cpp src/sensors/AarunoEncoder.cpp -o /tmp/aaruno_host
          /tmp/aaruno_host

  compile-avr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.0
      - name: Install AVR core
        run: arduino-cli core install arduino:avr@1.8.8
      - name: Compile Basic
        run: arduino-cli compile --fqbn arduino:avr:uno examples/Basic/Basic.ino
      - name: Compile Ultrasonic
        run: arduino-cli compile --fqbn arduino:avr:uno examples/Ultrasonic/Ultrasonic.ino
      - name: Compile LDR
        run: arduino-cli compile --fqbn arduino:avr:uno examples/LDR/LDR.ino
      - name: Compile MotionDetection
        run: arduino-cli compile --fqbn arduino:avr:uno examples/MotionDetection/MotionDetection.ino
      - name: Compile LEDBuzzer
        run: arduino-cli compile --fqbn arduino:avr:uno examples/LEDBuzzer/LEDBuzzer.ino

  compile-avr-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.0
      - name: Install AVR core
        run: arduino-cli core install arduino:avr@1.8.8
      - name: Install optional deps
        run: |
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit BMP280 Library"
      - name: Compile DHT11
        run: arduino-cli compile --fqbn arduino:avr:uno examples/DHT11/DHT11.ino
      - name: Compile OLED
        run: arduino-cli compile --fqbn arduino:avr:uno examples/OLED/OLED.ino
      - name: Compile I2CLCD
        run: arduino-cli compile --fqbn arduino:avr:uno examples/I2CLCD/I2CLCD.ino
      - name: Compile MPU6050
        run: arduino-cli compile --fqbn arduino:avr:uno examples/MPU6050/MPU6050.ino

  compile-renesas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.0
      - name: Install Renesas core
        run: arduino-cli core install arduino:renesas_uno@1.5.0
      - name: Compile Basic (Minima)
        run: arduino-cli compile --fqbn arduino:renesas_uno:minima examples/Basic/Basic.ino
      - name: Compile Basic (WiFi)
        run: arduino-cli compile --fqbn arduino:renesas_uno:unowifi examples/Basic/Basic.ino

  compile-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.0
      - name: Install ESP32 core
        run: |
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.0
      - name: Install optional deps
        run: |
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit BMP280 Library"
      - name: Compile Basic
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/Basic/Basic.ino
      - name: Compile Ultrasonic
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/Ultrasonic/Ultrasonic.ino
      - name: Compile LDR
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/LDR/LDR.ino
      - name: Compile MotionDetection
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/MotionDetection/MotionDetection.ino
      - name: Compile LEDBuzzer
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/LEDBuzzer/LEDBuzzer.ino
      - name: Compile I2CLCD
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/I2CLCD/I2CLCD.ino
      - name: Compile GasSensor
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/GasSensor/GasSensor.ino
      - name: Compile Joystick
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/Joystick/Joystick.ino
      - name: Compile RotaryEncoder
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/RotaryEncoder/RotaryEncoder.ino
      - name: Compile Keypad4x4
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/Keypad4x4/Keypad4x4.ino
      - name: Compile MPU6050
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/MPU6050/MPU6050.ino
      - name: Compile RGBLED
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/RGBLED/RGBLED.ino
      - name: Compile StepperMotor
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/StepperMotor/StepperMotor.ino
      - name: Compile HTTPGet
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/HTTPGet/HTTPGet.ino
      - name: Compile ESP32WiFi
        run: arduino-cli compile --fqbn esp32:esp32:esp32 examples/ESP32WiFi/ESP32WiFi.ino

  compile-esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.0
      - name: Install ESP8266 core
        run: |
          arduino-cli config add board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Install optional deps
        run: |
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit BMP280 Library"
      - name: Compile Basic
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/Basic/Basic.ino
      - name: Compile Ultrasonic
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/Ultrasonic/Ultrasonic.ino
      - name: Compile LDR
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/LDR/LDR.ino
      - name: Compile MotionDetection
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/MotionDetection/MotionDetection.ino
      - name: Compile LEDBuzzer
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/LEDBuzzer/LEDBuzzer.ino
      - name: Compile I2CLCD
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/I2CLCD/I2CLCD.ino
      - name: Compile GasSensor
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/GasSensor/GasSensor.ino
      - name: Compile Joystick
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/Joystick/Joystick.ino
      - name: Compile RotaryEncoder
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/RotaryEncoder/RotaryEncoder.ino
      - name: Compile Keypad4x4
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/Keypad4x4/Keypad4x4.ino
      - name: Compile MPU6050
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/MPU6050/MPU6050.ino
      - name: Compile RGBLED
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/RGBLED/RGBLED.ino
      - name: Compile StepperMotor
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/StepperMotor/StepperMotor.ino
      - name: Compile HTTPGet
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/HTTPGet/HTTPGet.ino
      - name: Compile ESP8266WiFi
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 examples/ESP8266WiFi/ESP8266WiFi.ino
